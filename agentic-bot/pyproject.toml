[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bot"
version = "0.1.0"
description = "Terminal-based Wikipedia edit proposal and review system."
requires-python = ">=3.14"
dependencies = [
  "pywikibot>=11.1,<12",
  "python-dotenv>=1.2.2,<2",
  "rich>=14.3.3,<15",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[project.scripts]
agentic-bot = "agentic_bot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["agentic_bot", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["agentic_bot*"]
