[source]
id = "belen16"
name = "Т. 16: Трыпалі — Хвіліна"
site_lang = "be"
family = "wikipedia"

[search]
insource_terms = [
  "Беларуская энцыклапедыя",
  "Т. 16: Трыпалі — Хвіліна",
]
isbns = [
  "985-11-0263-6",
]
keywords = []

[candidate]
must_contain_all = [
  "Беларуская энцыклапедыя",
  "Т. 16: Трыпалі — Хвіліна",
]
must_contain_any = []

[replacement]
template_name = "Крыніцы/БелЭн"
without_pages = "{{Крыніцы/БелЭн|16|{entry}|{author}||{responsible}}}"
with_pages = "{{Крыніцы/БелЭн|16|{entry}|{author}|{pages}|{responsible}}}"

[short_ref]
ref = "БелЭн"
year = "2003"

[summary]
default_format = "Замена бібліяграфічнай спасылкі шаблонам {{{template_name}}}"

[pages]
patterns = [
  '\b(?:с|стар)\.{{OPT_WS}}(?P<pages>{{PAGES}})',
  '\|{{OPT_WS}}(?:старонкі|pages?|pp?){{OPT_WS}}={{OPT_WS}}(?P<pages>{{PAGES}})(?={{OPT_WS}}(?:\||\}\}))',
]
reject_patterns = [
  '^\s*:\s*іл',
]

[normalization]
strip_nowiki = true
resolve_wikilinks = true
strip_formatting = true
normalize_nbsp = true
normalize_dashes = true
collapse_whitespace = true

[[normalization.alias_replacements]]
pattern = '\b(?:БелЭн\.?|Беларуская\s+энцыклапедыя)\b'
replacement = "БелЭн"
flags = "IGNORECASE|UNICODE"

[argument_extractors.author]
template_params = ["аўтар", "author", "частка аўтар"]
patterns = [
  '^(?:{{LIST_PREFIX}})(?P<value>{{ARTICLE_AUTHOR}}){{WS}}[^/\n]+?{{OPT_WS}}/{{OPT_WS}}{{ARTICLE_RESPONSIBLE}}{{OPT_WS}}//',
]
normalizer = "whitespace"

[argument_extractors.responsible]
template_params = ["частка адказны", "адказны частка", "chapter responsible", "part responsible"]
patterns = [
  '^(?:{{LIST_PREFIX}}){{ARTICLE_AUTHOR}}{{WS}}[^/\n]+?{{OPT_WS}}/{{OPT_WS}}(?P<value>{{ARTICLE_RESPONSIBLE}}){{OPT_WS}}//',
]
normalizer = "whitespace"

[macros]
TITLE = "(?:Беларуская{{WS}}энцыклапедыя|БелЭн)"
SERIES = '{{TITLE}}:{{OPT_WS}}У{{WS}}18{{WS}}т\.'
VOLUME = 'Т\.{{OPT_WS}}16:{{WS}}Трыпалі{{WS}}{{DASH}}{{WS}}Хвіліна'
SOURCE_ISBN = '985-11-0263-6'
TOM_PARAM = '16'
EDITOR = 'Рэдкал\.:{{OPT_WS}}Г\.{{OPT_WS}}П\.{{OPT_WS}}Пашкоў{{WS}}і{{WS}}інш\.?'
ARTICLE_AUTHOR = '[А-ЯЁІЎA-Z][^/\n]*?(?:{{WS}}{{INITIAL}}){1,3}'
ARTICLE_RESPONSIBLE = '(?:{{INITIAL}}{{OPT_WS}}){1,3}[А-ЯЁІЎA-Z][^/\n]+?'

[[regex_rules]]
name = "article_author_entry_responsible_with_pages"
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?P<author>{{ARTICLE_AUTHOR}}){{WS}}(?P<entry>[^/\n]+?){{OPT_WS}}/{{OPT_WS}}(?P<responsible>{{ARTICLE_RESPONSIBLE}}){{OPT_WS}}//{{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*?\b(?:С|с)\.{{OPT_WS}}(?P<pages>{{PAGES}}).*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "article_author_entry_responsible"
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?P<author>{{ARTICLE_AUTHOR}}){{WS}}(?P<entry>[^/\n]+?){{OPT_WS}}/{{OPT_WS}}(?P<responsible>{{ARTICLE_RESPONSIBLE}}){{OPT_WS}}//{{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "entry_only_with_pages"
review_required = true
review_note = "Entry inferred from bibliography prefix before //; confirm against the page title."
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?P<entry>[^/\n]+?){{OPT_WS}}//{{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*?\b(?:С|с)\.{{OPT_WS}}(?P<pages>{{PAGES}}).*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "entry_only"
review_required = true
review_note = "Entry inferred from bibliography prefix before //; confirm against the page title."
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?P<entry>[^/\n]+?){{OPT_WS}}//{{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "template_citation_with_pages"
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?=.*\|{{OPT_WS}}загаловак{{OPT_WS}}={{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}})(?=.*\|{{OPT_WS}}(?:адказны|частка{{WS}}адказны){{OPT_WS}}={{OPT_WS}}{{EDITOR}})(?=.*\|{{OPT_WS}}том{{OPT_WS}}={{OPT_WS}}{{TOM_PARAM}}(?:\b|{{OPT_WS}}(?:\||\}\})))(?=.*\|{{OPT_WS}}(?:isbn|isbn{{WS}}том){{OPT_WS}}={{OPT_WS}}[^|}]*{{SOURCE_ISBN}}).*?(?:\|{{OPT_WS}}(?:старонкі|pages?|pp?){{OPT_WS}}={{OPT_WS}}(?P<pages>{{PAGES}})).*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "template_citation"
pattern = '^(?P<prefix>{{LIST_PREFIX}})(?=.*\|{{OPT_WS}}загаловак{{OPT_WS}}={{OPT_WS}}{{SERIES}}{{WS}}{{VOLUME}})(?=.*\|{{OPT_WS}}(?:адказны|частка{{WS}}адказны){{OPT_WS}}={{OPT_WS}}{{EDITOR}})(?=.*\|{{OPT_WS}}том{{OPT_WS}}={{OPT_WS}}{{TOM_PARAM}}(?:\b|{{OPT_WS}}(?:\||\}\})))(?=.*\|{{OPT_WS}}(?:isbn|isbn{{WS}}том){{OPT_WS}}={{OPT_WS}}[^|}]*{{SOURCE_ISBN}}).*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "full_line_bibliography_with_pages"
pattern = '^(?P<prefix>{{LIST_PREFIX}}){{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*?\b(?:С|с)\.{{OPT_WS}}(?P<pages>{{PAGES}}).*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true

[[regex_rules]]
name = "full_line_bibliography"
pattern = '^(?P<prefix>{{LIST_PREFIX}}){{SERIES}}{{WS}}{{VOLUME}}{{OPT_WS}}/{{OPT_WS}}{{EDITOR}}.*$'
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE|MULTILINE"
enabled = true
