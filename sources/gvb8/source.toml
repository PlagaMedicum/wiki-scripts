[source]
id = "gvb8"
name = "Т. 8: Мінская вобласць, кн. 1"
site_lang = "be"
family = "wikipedia"

[search]
insource_terms = [
  "Мінская вобласць",
]
isbns = [
  "978-985-11-0520-1",
]
keywords = []

[candidate]
must_contain_all = [
  "Мінская вобласць",
]
must_contain_any = [
  "Т. 8: Мінская вобласць, кн. 1",
  "978-985-11-0520-1",
]

[replacement]
template_name = "Крыніцы/ГВБ"
without_pages = "{{Крыніцы/ГВБ|8-1|{entry}}}"
with_pages = "{{Крыніцы/ГВБ|8-1|{entry}|{pages}}}"

[summary]
default_format = "Замена бібліяграфічнай спасылкі шаблонам {{{template_name}}}"

[pages]
patterns = [
  "\\b(?:с|стар)\\.{{OPT_WS}}(?P<pages>{{PAGES}})",
  "\\|{{OPT_WS}}(?:старонкі|pages?|pp?){{OPT_WS}}={{OPT_WS}}(?P<pages>{{PAGES}})(?={{OPT_WS}}(?:\\||\\}\\}))",
]
reject_patterns = [
  "^\\s*:\\s*іл",
]

[normalization]
strip_nowiki = true
resolve_wikilinks = true
strip_formatting = true
normalize_nbsp = true
normalize_dashes = true
collapse_whitespace = true

[[normalization.alias_replacements]]
pattern = '\b(?:БелЭн\.?|Беларуская\s+энцыклапедыя(?:\s+імя\s+Петруся\s+Броўкі)?|Беларус\.\s*Энцыкл\.\s*(?:імя\s*П\.\s*Броўкі)?)\b'
replacement = "БелЭн"
flags = "IGNORECASE|UNICODE"

