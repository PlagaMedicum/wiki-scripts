[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bewiki-biblio"
version = "0.1.0"
description = "Reusable be.wiki bibliography replacement tooling."
requires-python = ">=3.14"
dependencies = [
  "pywikibot",
  "python-dotenv",
  "rich",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
bewiki-biblio = "bewiki_biblio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["bewiki_biblio", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["bewiki_biblio*"]
