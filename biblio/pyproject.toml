[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblio"
version = "0.1.0"
description = "Reusable bibliography replacement tooling first developed for be.wiki."
requires-python = ">=3.14"
dependencies = [
  "pywikibot>=11.1,<12",
  "prompt-toolkit>=3.0.52,<4",
  "python-dotenv>=1.2.2,<2",
  "rich>=14.3.3,<15",
]

[dependency-groups]
dev = [
  "pip-audit>=2.10,<3",
  "pytest>=9,<10",
  "ruff>=0.15,<0.16",
]

[project.scripts]
biblio = "biblio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["biblio", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["biblio*"]
