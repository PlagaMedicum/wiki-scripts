[source]
id = "myths-1992-volume2"
name = "Мифы народов мира: Энциклопедия, том 2"
site_lang = "be"
family = "wikipedia"

[search]
insource_terms = ["Мифы народов мира", "1991"]

[candidate]
must_contain_all = ["Мифы народов мира", "1991", "том=2"]

[replacement]
template_name = "Крыніцы/Мифы народов мира: Энциклопедия"
without_pages = "{{Крыніцы/Мифы народов мира: Энциклопедия|том=2}}"
with_pages = "{{Крыніцы/Мифы народов мира: Энциклопедия|том=2|старонкі={pages}}}"

[normalization]
resolve_wikilinks = false
strip_formatting = false

[summary]
default_format = "Замена бібліяграфічнай спасылкі шаблонам {{{template_name}}}"

[[regex_rules]]
name = "book_volume2_pages"
pattern = '''(?x)
^(?P<prefix>{{LIST_PREFIX}})\{\{\s*кніга\s*
(?=
    (?:\|[^|{}]*){5}\s*\}\}
  | (?=[^{}]*\|\s*аўтар\s*=\s*(?:\||\}\}))(?:\|[^|{}]*){6}\s*\}\}
)
(?=[^{}]*\|\s*загаловак\s*=\s*Мифы\ народов\ мира\.\s*В\ 2-х\ т\s*(?:\||\}\}))
(?=[^{}]*\|\s*месца\s*=\s*М\.\s*(?:\||\}\}))
(?=[^{}]*\|\s*год\s*=\s*1991\s*—\s*1992\s*(?:\||\}\}))
(?=[^{}]*\|\s*том\s*=\s*2\s*(?:\||\}\}))
(?=[^{}]*\|\s*старонкі\s*=\s*(?P<pages>{{PAGES}})\s*(?:\||\}\}))
(?:\|\s*(?:аўтар|загаловак|месца|год|том|старонкі)\s*=\s*[^|{}\[\]<>]*){5,6}
\s*\}\}$
'''
replacement = "{prefix}{template}"
flags = "IGNORECASE|UNICODE"
review_required = true
review_note = "Confirm the second volume, edition, pages, and target reference anchor before saving."
