[package]
name = "suppressor"
version = "1.0.0"
edition = "2024"
description = "public revision-delete daemon first developed for be.wiki"
license = "MIT"
autobins = false
publish = false

[workspace]
members = [".", "core"]
resolver = "3"

[[bin]]
name = "suppressor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
nix = { version = "0.29", features = ["process", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
suppressor-core = { version = "0.1.0", path = "core" }
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.15"
wiremock = "0.6"
